<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Cone Projekce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: projekční místnost — úzký pult s filtry vlevo, plátno s kontaktním archem snímků vpravo; přehrávač jako promítání přes celou místnost */
:root {
  --bg: #f3f1ec;
  --panel: #e9e6df;
  --card: #ffffff;
  --fg: #1c1b22;
  --muted: #6b6873;
  --line: #d6d2c9;
  --accent: #b5650f;        /* sodíková lampa projektoru */
  --accent-ink: #ffffff;
  --sel: #b5650f22;
  --shade: #0b0a10;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e14; --panel: #16151d; --card: #1b1a23; --fg: #ece8df; --muted: #9a96a3;
    --line: #2c2a36; --accent: #f0a640; --accent-ink: #17120a; --sel: #f0a64026; --shade: #000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e14; --panel: #16151d; --card: #1b1a23; --fg: #ece8df; --muted: #9a96a3;
  --line: #2c2a36; --accent: #f0a640; --accent-ink: #17120a; --sel: #f0a64026; --shade: #000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--body);
  padding-top: env(safe-area-inset-top, 0px);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }

/* ---- pult ---- */
.side {
  background: var(--panel); border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 22px 20px 30px max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 {
  font: 800 2.35rem/0.9 var(--display); letter-spacing: 0.01em; margin: 0; text-transform: uppercase;
}
.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 0.82rem; }

.search { position: relative; }
.search input {
  width: 100%; padding: 11px 12px 11px 38px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); font-size: 1rem;
}
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; }
.hint { font-size: 0.74rem; color: var(--muted); margin-top: 6px; }
.hint code { font-family: var(--mono); font-size: 0.72rem; background: var(--card); border: 1px solid var(--line); padding: 0 4px; border-radius: 3px; }

.group { display: flex; flex-direction: column; gap: 8px; }
.group > label, .group > .lbl {
  font: 500 0.7rem/1 var(--mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 4px 10px; font-size: 0.8rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline;
}
.chip small { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.75; }

.range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.range input, .side select {
  width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--card);
  font-family: var(--mono); font-size: 0.85rem;
}
.range span { color: var(--muted); }

.side .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 8px 12px; cursor: pointer;
  font-weight: 500; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 7px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:hover { border-color: var(--accent); }

/* ---- plátno ---- */
.main { min-width: 0; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 60px 26px; }
.bar {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px;
}
.count { font: 700 1.6rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
.count small { font: 400 0.85rem var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
.active { display: flex; flex-wrap: wrap; gap: 6px; }
.active .chip { font-size: 0.75rem; }
.sortbox { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.85rem; }
.sortbox select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 18px; }
.card { display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
.frame {
  position: relative; aspect-ratio: 22 / 15; background: var(--shade); border-radius: 4px; overflow: hidden;
  max-width: 100%;
}
.frame img, .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.frame img { transition: opacity .25s; }
.frame video { opacity: 0; transition: opacity .3s; }
.frame.playing video { opacity: 1; }
.frame .dur {
  position: absolute; right: 6px; bottom: 6px; background: #000000b0; color: #fff;
  font: 500 0.7rem/1 var(--mono); padding: 4px 6px; border-radius: 3px;
}
.frame .play {
  position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .2s;
  background: linear-gradient(transparent 50%, #0008);
}
.card:hover .frame .play, .card:focus-visible .frame .play { opacity: 1; }
.play i {
  width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center;
}
.play i::after { content: ""; border-left: 14px solid var(--accent-ink); border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.fav {
  position: absolute; left: 6px; top: 6px; background: #000000a0; color: #fff; border: 0; border-radius: 50%;
  width: 28px; height: 28px; cursor: pointer; font-size: 15px; line-height: 1; opacity: 0; transition: opacity .2s;
}
.card:hover .fav, .fav.on { opacity: 1; }
.fav.on { color: #f6b54a; }
.card h3 { margin: 0; font: 700 1.12rem/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.card .who { font-size: 0.85rem; color: var(--fg); }
.card .meta { font: 0.72rem/1.4 var(--mono); color: var(--muted); }
mark { background: var(--sel); color: inherit; border-radius: 2px; box-shadow: 0 1px 0 var(--accent); }

.more { display: flex; justify-content: center; margin-top: 30px; }
.empty { grid-column: 1 / -1; padding: 60px 0; color: var(--muted); text-align: center; }
.empty b { display: block; font: 700 1.6rem var(--display); color: var(--fg); text-transform: uppercase; }

/* ---- promítání ---- */
.screen {
  position: fixed; inset: 0; z-index: 50; background: #07060bf2; color: #ece8df;
  display: grid; grid-template-columns: minmax(0, 1fr) 380px;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.screen .stage { display: flex; align-items: center; justify-content: center; padding: 24px; min-width: 0; position: relative; }
.screen video { width: 100%; max-height: calc(100vh - 48px); background: #000; border-radius: 3px; }
.screen aside {
  border-left: 1px solid #2c2a36; padding: 26px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  background: #100f16;
}
.screen h2 { margin: 0; font: 800 2rem/0.95 var(--display); text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
.screen .who a { color: #f0a640; text-decoration: none; font-weight: 500; }
.screen .who a:hover { text-decoration: underline; }
.screen .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font: 0.8rem/1.45 var(--mono); }
.screen .facts dt { color: #9a96a3; }
.screen .facts dd { margin: 0; }
.screen .desc { font-size: 0.92rem; line-height: 1.6; white-space: pre-line; color: #d9d4ca; }
.screen .row { display: flex; flex-wrap: wrap; gap: 8px; }
.screen .btn { background: #1b1a23; border-color: #2c2a36; color: #ece8df; }
.screen .btn.primary { background: #f0a640; color: #17120a; border-color: #f0a640; }
.screen .close {
  position: absolute; top: 14px; left: 14px; z-index: 2;
}
.screen .nav { position: absolute; top: 50%; translate: 0 -50%; z-index: 2; width: 44px; height: 64px; justify-content: center; }
.screen .nav.prev { left: 10px; } .screen .nav.next { right: 10px; }
.screen .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.screen .gallery img { width: 100%; aspect-ratio: 22/15; object-fit: cover; border-radius: 2px; }
.kbd { font: 0.7rem var(--mono); color: #9a96a3; }
.kbd b { border: 1px solid #2c2a36; border-radius: 3px; padding: 0 4px; font-weight: 400; }

.filters-toggle { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
  .side .collapsible { display: none; }
  .side.open .collapsible { display: flex; }
  .filters-toggle { display: inline-flex; }
  .main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px 12px; }
  .screen { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
  .screen .stage { padding: 56px 0 0; }
  .screen video { max-height: 50vh; border-radius: 0; }
  .screen aside { border-left: 0; overflow: visible; }
  .screen .nav { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1>Light Cone<br><span>Projekce</span></h1>
      <p id="sub">Katalog experimentálních filmů s ukázkou</p>
    </div>

    <div class="group">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Název, filmař, popis…" autocomplete="off" aria-label="Hledat">
      </div>
      <div class="hint">Víc slov = musí platit všechna. Vyloučit: <code>-war</code>. Přesná fráze: <code>"found footage"</code>.</div>
    </div>

    <div class="actions">
      <button class="btn primary" id="random" type="button">Náhodný film</button>
      <button class="btn filters-toggle" id="ftoggle" type="button" aria-expanded="false">Filtry</button>
      <button class="btn" id="reset" type="button">Zrušit filtry</button>
    </div>

    <div class="group collapsible">
      <span class="lbl">Rok</span>
      <div class="range">
        <input id="ymin" type="number" inputmode="numeric" placeholder="od" aria-label="Rok od">
        <span>–</span>
        <input id="ymax" type="number" inputmode="numeric" placeholder="do" aria-label="Rok do">
      </div>
      <div class="chips" id="decades"></div>
    </div>

    <div class="group collapsible">
      <span class="lbl">Délka filmu (min)</span>
      <div class="range">
        <input id="dmin" type="number" inputmode="numeric" placeholder="od" aria-label="Délka od">
        <span>–</span>
        <input id="dmax" type="number" inputmode="numeric" placeholder="do" aria-label="Délka do">
      </div>
      <div class="chips" id="lengths"></div>
    </div>

    <div class="group collapsible"><span class="lbl">Barva</span><div class="chips" id="f-col"></div></div>
    <div class="group collapsible"><span class="lbl">Zvuk</span><div class="chips" id="f-snd"></div></div>
    <div class="group collapsible"><span class="lbl">Natočeno na</span><div class="chips" id="f-fmt"></div></div>
    <div class="group collapsible"><span class="lbl">Počet pláten</span><div class="chips" id="f-scr"></div></div>
    <div class="group collapsible"><span class="lbl">Moje</span><div class="chips" id="f-my"></div></div>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="count" id="count"></div>
      <div class="active" id="active"></div>
      <label class="sortbox" for="sort">Řadit
        <select id="sort">
          <option value="rel">podle shody</option>
          <option value="new">nejnovější</option>
          <option value="old">nejstarší</option>
          <option value="short">nejkratší</option>
          <option value="long">nejdelší</option>
          <option value="az">název A–Z</option>
          <option value="author">filmař A–Z</option>
        </select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn" id="more" type="button" hidden>Zobrazit další</button></div>
  </main>
</div>

<div class="screen" id="screen" hidden role="dialog" aria-modal="true" aria-labelledby="s-title">
  <div class="stage">
    <button class="btn close" id="s-close" type="button">✕ Zavřít</button>
    <button class="btn nav prev" id="s-prev" type="button" aria-label="Předchozí film">‹</button>
    <video id="s-video" controls playsinline preload="metadata"></video>
    <button class="btn nav next" id="s-next" type="button" aria-label="Další film">›</button>
  </div>
  <aside>
    <h2 id="s-title"></h2>
    <div class="who" id="s-who"></div>
    <dl class="facts" id="s-facts"></dl>
    <div class="row">
      <a class="btn primary" id="s-link" target="_blank" rel="noopener">Otevřít na Light Cone</a>
      <button class="btn" id="s-fav" type="button">☆ Uložit</button>
      <button class="btn" id="s-random" type="button">Náhodný</button>
    </div>
    <div class="desc" id="s-desc"></div>
    <div class="gallery" id="s-gal"></div>
    <div class="kbd"><b>←</b> <b>→</b> další film · <b>Esc</b> zavřít · <b>R</b> náhodný</div>
  </aside>
</div>

<script>
let FILMS = [];
const $ = id => document.getElementById(id);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDur = s => s == null ? '' : (s >= 3600 ? Math.floor(s / 3600) + 'h ' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + '′' : Math.floor(s / 60) + '′' + String(s % 60).padStart(2, '0'));


let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('lc-favs') || '[]')); } catch (e) {}
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('lc-seen') || '[]')); } catch (e) {}
const persist = () => { try { localStorage.setItem('lc-favs', JSON.stringify([...favs])); localStorage.setItem('lc-seen', JSON.stringify([...seen])); } catch (e) {} };

const state = { q: '', ymin: null, ymax: null, dmin: null, dmax: null, col: new Set(), snd: new Set(), fmt: new Set(), scr: new Set(), my: new Set(), author: null, sort: 'rel' };
const PAGE = 60;
let results = [], shown = 0, terms = [];

// ---- facety ----
function countBy(key) {
  const m = new Map();
  for (const f of FILMS) for (const v of [].concat(f[key])) if (v) m.set(v, (m.get(v) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function chipGroup(el, key, entries, labels = {}) {
  el.innerHTML = '';
  for (const [v, n] of entries) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.v = v;
    b.setAttribute('aria-pressed', state[key].has(v));
    b.innerHTML = `${esc(labels[v] || v)} <small>${n}</small>`;
    b.onclick = () => { state[key].has(v) ? state[key].delete(v) : state[key].add(v); update(); };
    el.appendChild(b);
  }
}
const COL = { 'color': 'barevný', 'b&w': 'černobílý', 'color-b&w': 'barva + čb', 'tinted b&w': 'tónovaný čb' };
const SND = { 'sound': 'zvukový', 'silent': 'němý' };
const SCR = { '1': '1 plátno', '2': '2 plátna', '3': '3 plátna', '4+': '4 a víc' };
function buildFacets() {
  chipGroup($('f-col'), 'col', countBy('col'), COL);
  chipGroup($('f-snd'), 'snd', countBy('snd'), SND);
  chipGroup($('f-fmt'), 'fmt', countBy('fg'));
  chipGroup($('f-scr'), 'scr', countBy('scr').sort((a, b) => a[0].localeCompare(b[0])), SCR);
  chipGroup($('f-my'), 'my', [['fav', favs.size], ['unseen', FILMS.length - seen.size]], { fav: '★ uložené', unseen: 'ještě neviděné' });
  // dekády
  const dec = new Map();
  for (const f of FILMS) if (f.y) { const d = Math.floor(f.y / 10) * 10; dec.set(d, (dec.get(d) || 0) + 1); }
  $('decades').innerHTML = '';
  for (const [d, n] of [...dec].sort((a, b) => a[0] - b[0])) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', state.ymin === d && state.ymax === d + 9);
    b.innerHTML = `${String(d).slice(d < 2000 ? 2 : 0)}s <small>${n}</small>`;
    b.onclick = () => { const on = state.ymin === d && state.ymax === d + 9; state.ymin = on ? null : d; state.ymax = on ? null : d + 9; syncInputs(); update(); };
    $('decades').appendChild(b);
  }
  const LEN = [['do 5 min', 0, 5], ['5–15', 5, 15], ['15–40', 15, 40], ['přes 40', 40, null]];
  $('lengths').innerHTML = '';
  for (const [l, a, z] of LEN) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', state.dmin === a && state.dmax === z);
    b.textContent = l;
    b.onclick = () => { const on = state.dmin === a && state.dmax === z; state.dmin = on ? null : a; state.dmax = on ? null : z; syncInputs(); update(); };
    $('lengths').appendChild(b);
  }
}
function syncInputs() { for (const k of ['ymin', 'ymax', 'dmin', 'dmax']) $(k).value = state[k] ?? ''; }

// ---- dotaz ----
function parseQuery(q) {
  const inc = [], exc = [];
  const re = /(-?)"([^"]+)"|(-?)(\S+)/g; let m;
  while ((m = re.exec(q))) {
    const neg = m[1] || m[3]; const t = norm(m[2] || m[4]);
    if (!t || t === '-') continue;
    (neg ? exc : inc).push(t);
  }
  return { inc, exc };
}
function score(f, inc, exc) {
  for (const t of exc) if (f._t.includes(t) || f._a.includes(t) || f._d.includes(t)) return -1;
  let s = 0;
  for (const t of inc) {
    let ts = 0;
    if (f._t === t) ts = 40; else if (f._t.startsWith(t)) ts = 25;
    else if (new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(f._t)) ts = 18; else if (f._t.includes(t)) ts = 12;
    if (f._a.includes(t)) ts = Math.max(ts, 15);
    if (!ts && f._m.includes(t)) ts = 6;
    if (!ts && f._d.includes(t)) ts = 2 + Math.min(3, f._d.split(t).length - 2);
    if (!ts) return -1;
    s += ts;
  }
  return s;
}
function update(keepScroll) {
  const { inc, exc } = parseQuery(state.q);
  terms = inc;
  const out = [];
  for (const f of FILMS) {
    if (state.author && !f.a.includes(state.author)) continue;
    if (state.ymin != null && !(f.y >= state.ymin)) continue;
    if (state.ymax != null && !(f.y <= state.ymax)) continue;
    if (state.dmin != null && !(f.s >= state.dmin * 60)) continue;
    if (state.dmax != null && !(f.s <= state.dmax * 60)) continue;
    if (state.col.size && !state.col.has(f.col)) continue;
    if (state.snd.size && !state.snd.has(f.snd)) continue;
    if (state.fmt.size && !f.fg.some(g => state.fmt.has(g))) continue;
    if (state.scr.size && !state.scr.has(f.scr)) continue;
    if (state.my.has('fav') && !favs.has(f.id)) continue;
    if (state.my.has('unseen') && seen.has(f.id)) continue;
    const sc = inc.length || exc.length ? score(f, inc, exc) : 0;
    if (sc < 0) continue;
    f._s = sc; out.push(f);
  }
  const by = {
    rel: (a, b) => b._s - a._s || (b.y || 0) - (a.y || 0),
    new: (a, b) => (b.y || 0) - (a.y || 0) || b.id - a.id,
    old: (a, b) => (a.y || 9999) - (b.y || 9999),
    short: (a, b) => (a.s ?? 1e9) - (b.s ?? 1e9),
    long: (a, b) => (b.s ?? -1) - (a.s ?? -1),
    az: (a, b) => a._t.localeCompare(b._t),
    author: (a, b) => a._a.localeCompare(b._a) || (a.y || 0) - (b.y || 0),
  };
  out.sort(by[state.sort === 'rel' && !inc.length ? 'new' : state.sort]);
  results = out; shown = 0;
  $('grid').innerHTML = '';
  renderMore();
  renderBar();
  buildFacets();
  if (!keepScroll) window.scrollTo({ top: 0 });
}
function hl(text, field) {
  let h = esc(text);
  if (!terms.length) return h;
  const raw = text; const n = norm(raw);
  const ranges = [];
  for (const t of terms) { let i = -1; while ((i = n.indexOf(t, i + 1)) !== -1) ranges.push([i, i + t.length]); }
  if (!ranges.length) return h;
  ranges.sort((a, b) => a[0] - b[0]);
  let o = '', p = 0;
  for (const [a, b] of ranges) { if (a < p) continue; o += esc(raw.slice(p, a)) + '<mark>' + esc(raw.slice(a, b)) + '</mark>'; p = b; }
  return o + esc(raw.slice(p));
}
function snippet(f) {
  if (!terms.length || !f.d) return '';
  const n = norm(f.d);
  for (const t of terms) {
    const i = n.indexOf(t);
    if (i >= 0 && !f._t.includes(t) && !f._a.includes(t)) {
      const a = Math.max(0, i - 50), b = Math.min(f.d.length, i + t.length + 70);
      return (a ? '…' : '') + hl(f.d.slice(a, b).replace(/\s+/g, ' ')) + (b < f.d.length ? '…' : '');
    }
  }
  return '';
}
function card(f, idx) {
  const el = document.createElement('article');
  el.className = 'card'; el.tabIndex = 0; el.dataset.idx = idx;
  const sn = snippet(f);
  el.innerHTML = `
    <div class="frame">
      <img loading="lazy" src="${esc(f.img)}" alt="">
      <div class="play"><i></i></div>
      ${f.s != null ? `<span class="dur">${fmtDur(f.s)}</span>` : ''}
      <button class="fav ${favs.has(f.id) ? 'on' : ''}" type="button" aria-label="Uložit">${favs.has(f.id) ? '★' : '☆'}</button>
    </div>
    <h3>${hl(f.t)}</h3>
    <div class="who">${hl(f.a.join(', '))}</div>
    <div class="meta">${esc([f.ys, f.fmt, COL[f.col] || f.col, SND[f.snd] || f.snd].filter(Boolean).join(' · '))}</div>
    ${sn ? `<div class="meta">${sn}</div>` : ''}`;
  el.onclick = e => { if (e.target.closest('.fav')) return; openFilm(idx); };
  el.onkeydown = e => { if (e.key === 'Enter') openFilm(idx); };
  el.querySelector('.fav').onclick = e => { e.stopPropagation(); toggleFav(f); const b = e.currentTarget; b.classList.toggle('on', favs.has(f.id)); b.textContent = favs.has(f.id) ? '★' : '☆'; };
  // náhled při najetí myší
  const frame = el.querySelector('.frame'); let timer, vid;
  frame.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse' || !f.v) return;
    timer = setTimeout(() => {
      vid = document.createElement('video'); vid.muted = true; vid.playsInline = true; vid.loop = true; vid.preload = 'auto';
      vid.src = f.v + '#t=' + Math.min(20, Math.max(2, (f.s || 60) / 5));
      vid.oncanplay = () => { frame.classList.add('playing'); vid.play().catch(() => {}); };
      frame.appendChild(vid);
    }, 450);
  });
  frame.addEventListener('pointerleave', () => { clearTimeout(timer); if (vid) { vid.pause(); vid.removeAttribute('src'); vid.load(); vid.remove(); vid = null; } frame.classList.remove('playing'); });
  return el;
}
function renderMore() {
  const frag = document.createDocumentFragment();
  const end = Math.min(results.length, shown + PAGE);
  for (let i = shown; i < end; i++) frag.appendChild(card(results[i], i));
  $('grid').appendChild(frag); shown = end;
  $('more').hidden = shown >= results.length;
  $('more').textContent = `Zobrazit další (${results.length - shown})`;
  if (!results.length) $('grid').innerHTML = state.author && !FILMS.some(f => f.a.includes(state.author))
    ? `<div class="empty"><b>Žádná ukázka</b>${esc(state.author)} nemá v katalogu žádný film s online ukázkou.</div>`
    : '<div class="empty"><b>Nic nenalezeno</b>Zkus méně slov nebo uvolni filtry.</div>';
}
function renderBar() {
  $('count').innerHTML = `${results.length.toLocaleString('cs')} <small>z ${FILMS.length.toLocaleString('cs')} filmů</small>`;
  const a = $('active'); a.innerHTML = '';
  const add = (label, off) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'true'); b.textContent = label + ' ✕'; b.onclick = () => { off(); syncInputs(); update(); }; a.appendChild(b); };
  if (state.author) add('filmař: ' + state.author, () => state.author = null);
  if (state.ymin != null || state.ymax != null) add(`rok ${state.ymin ?? '…'}–${state.ymax ?? '…'}`, () => { state.ymin = state.ymax = null; });
  if (state.dmin != null || state.dmax != null) add(`${state.dmin ?? 0}–${state.dmax ?? '∞'} min`, () => { state.dmin = state.dmax = null; });
}
function toggleFav(f) { favs.has(f.id) ? favs.delete(f.id) : favs.add(f.id); persist(); }

// ---- promítání ----
let cur = -1;
function openFilm(idx) {
  const f = results[idx]; if (!f) return;
  cur = idx;
  const v = $('s-video');
  v.src = f.v; v.poster = f.img;
  $('s-title').textContent = f.t;
  $('s-who').innerHTML = f.a.map(n => `<a href="#" data-a="${esc(n)}">${esc(n)}</a>`).join(', ') +
    (f.a.length ? ` <span class="kbd">— klikni pro všechny jeho/její filmy</span>` : '');
  $('s-who').querySelectorAll('a').forEach(x => x.onclick = e => { e.preventDefault(); closeFilm(); state.author = x.dataset.a; state.q = ''; $('q').value = ''; update(); });
  const facts = [['rok', f.ys], ['natočeno', f.fmt], ['barva', COL[f.col] || f.col], ['zvuk', SND[f.snd] || f.snd], ['plátna', f.scr], ['délka', fmtDur(f.s)], ['distribuce', f.dist], ['půjčovné', f.fee]];
  $('s-facts').innerHTML = facts.filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(String(v))}</dd>`).join('');
  $('s-desc').textContent = f.d || '';
  $('s-gal').innerHTML = (f.imgs || []).slice(0, 6).map(u => `<img loading="lazy" src="${esc(u)}" alt="">`).join('');
  $('s-link').href = f.u;
  $('s-fav').textContent = favs.has(f.id) ? '★ Uloženo' : '☆ Uložit';
  $('s-prev').disabled = idx <= 0; $('s-next').disabled = idx >= results.length - 1;
  $('screen').hidden = false; document.body.style.overflow = 'hidden';
  v.play().catch(() => {});
  seen.add(f.id); persist();
}
function closeFilm() {
  const v = $('s-video'); v.pause(); v.removeAttribute('src'); v.load();
  $('screen').hidden = true; document.body.style.overflow = '';
  const el = document.querySelector(`.card[data-idx="${cur}"]`); if (el) el.focus({ preventScroll: false });
}
function step(d) {
  const n = cur + d; if (n < 0 || n >= results.length) return;
  while (shown <= n) renderMore();
  openFilm(n);
}
function randomFilm() {
  if (!results.length) return;
  const pool = results.filter(f => !seen.has(f.id));
  const f = (pool.length ? pool : results)[Math.floor(Math.random() * (pool.length || results.length))];
  const idx = results.indexOf(f);
  while (shown <= idx) renderMore();
  openFilm(idx);
}

// ---- ovládání ----
let qt;
$('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; if (state.q && state.sort !== 'rel') { /* nech uživatelovo řazení */ } update(); }, 120); });
for (const k of ['ymin', 'ymax', 'dmin', 'dmax']) $(k).addEventListener('change', e => { const v = e.target.value.trim(); state[k] = v === '' ? null : +v; update(); });
$('sort').onchange = e => { state.sort = e.target.value; update(); };
$('more').onclick = renderMore;
$('random').onclick = randomFilm;
$('s-random').onclick = randomFilm;
$('reset').onclick = () => { Object.assign(state, { q: '', ymin: null, ymax: null, dmin: null, dmax: null, author: null }); for (const k of ['col', 'snd', 'fmt', 'scr', 'my']) state[k].clear(); $('q').value = ''; syncInputs(); update(); };
$('ftoggle').onclick = () => { const s = $('side').classList.toggle('open'); $('ftoggle').setAttribute('aria-expanded', s); };
$('s-close').onclick = closeFilm;
$('s-prev').onclick = () => step(-1);
$('s-next').onclick = () => step(1);
$('s-fav').onclick = () => { const f = results[cur]; toggleFav(f); $('s-fav').textContent = favs.has(f.id) ? '★ Uloženo' : '☆ Uložit'; };
$('screen').addEventListener('click', e => { if (e.target.classList.contains('stage')) closeFilm(); });
document.addEventListener('keydown', e => {
  const open = !$('screen').hidden;
  if (open && e.key === 'Escape') closeFilm();
  else if (open && e.key === 'ArrowRight' && e.target.tagName !== 'VIDEO') step(1);
  else if (open && e.key === 'ArrowLeft' && e.target.tagName !== 'VIDEO') step(-1);
  else if ((e.key === 'r' || e.key === 'R') && !/INPUT|SELECT/.test(e.target.tagName) && !e.metaKey && !e.ctrlKey) randomFilm();
  else if (e.key === '/' && !open && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
});
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < results.length && shown > 0) renderMore(); }, { rootMargin: '800px' }).observe($('more').parentElement);

// ?q=…&author=… — odkaz z rozšíření nebo sdílené hledání
function readParams() {
  const p = new URLSearchParams(location.search);
  if (p.get('q')) { state.q = p.get('q'); $('q').value = state.q; }
  if (p.get('author')) state.author = p.get('author');
  return p.get('film');
}

$('grid').innerHTML = '<div class="empty"><b>Načítám katalog…</b></div>';
fetch('films.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(({ updated, films }) => {
    FILMS = films;
    // indexy pro hledání
    for (const f of FILMS) {
      f._t = norm(f.t); f._a = norm(f.a.join(' ')); f._d = norm(f.d); f._m = norm([f.fmt, f.col, f.snd, f.ys].join(' '));
    }
    const d = new Date(updated);
    $('sub').textContent = `${FILMS.length.toLocaleString('cs')} experimentálních filmů s ukázkou · aktualizováno ${d.toLocaleDateString('cs')}`;
    const film = readParams();
    update();
    if (film) { const i = results.findIndex(f => f.id === +film); if (i >= 0) { while (shown <= i) renderMore(); openFilm(i); } }
  })
  .catch(e => { $('grid').innerHTML = `<div class="empty"><b>Katalog se nenačetl</b>Soubor films.json chybí nebo je poškozený (${esc(String(e.message))}). Zkus stránku obnovit.</div>`; });
</script>
