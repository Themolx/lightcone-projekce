name: Aktualizace katalogu

on:
  schedule:
    - cron: "17 4 * * 1"   # každé pondělí ráno
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalogue
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout nové filmy
        run: python scripts/scrape.py
      - name: Sestavit films.json
        run: python scripts/build.py
      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/raw.json films.json
          if git diff --cached --quiet; then
            echo "Žádné změny."
          else
            git commit -m "Aktualizace katalogu $(date -u +%Y-%m-%d)"
            git push
          fi
